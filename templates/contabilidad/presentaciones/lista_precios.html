{% extends 'contabilidad/base_contabilidad.html' %} 
{% block page_title %}Generar Lista de Precios{% endblock %} 
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="fas fa-file-invoice-dollar"></i> Generar Lista de Precios</h2>
</div>

<!-- Filtros -->
<div class="card mb-4">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Género</label>
        <select id="f-genero" class="form-select">
          <option value="">Todos</option>
          {% for value, label in generos %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Familia Olfativa</label>
        <select id="f-familia" class="form-select">
          <option value="">Todas</option>
          {% for familia in familias %}
          <option value="{{ familia.id }}">{{ familia.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Marca</label>
        <input type="text" id="f-marca" class="form-control" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Nombre</label>
        <input type="text" id="f-nombre" class="form-control" />
      </div>
    </div>
  </div>
</div>

<!-- Selección y generación del PDF -->
<form
  method="POST"
  action="{% url 'contabilidad:lista_precios_pdf' %}"
  target="_blank"
  id="form-pdf"
>
  {% csrf_token %}
  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover" id="tabla-perfumes" style="width: 100%">
        <thead>
          <tr>
            <th style="width: 40px">
              <input type="checkbox" id="check-all" />
            </th>
            <th>Marca</th>
            <th>Fragancia</th>
            <th>Género</th>
          </tr>
        </thead>
        <tbody id="tbody-perfumes"></tbody>
      </table>
    </div>
  </div>

  <div class="mt-3">
    <button type="submit" class="btn btn-primary">
      <i class="fas fa-file-pdf"></i> Generar PDF
    </button>
  </div>
</form>
{% endblock %} 
{% block extra_js %}
<script>
  let tabla = null;
  const seleccionados = new Set();

  function renderFilas(perfumes) {
    const tbody = document.getElementById("tbody-perfumes");
    tbody.innerHTML = "";

    perfumes.forEach((p) => {
      const checked = seleccionados.has(p.id) ? "checked" : "";
      const tr = document.createElement("tr");
      tr.innerHTML = `
            <td><input type="checkbox" name="perfumes" value="${p.id}" class="perfume-check" ${checked}></td>
            <td>${p.marca}</td>
            <td>${p.nombre}</td>
            <td>${p.genero}</td>
        `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll(".perfume-check").forEach((cb) => {
      cb.addEventListener("change", function () {
        const id = Number.parseInt(this.value);
        if (this.checked) {
          seleccionados.add(id);
        } else {
          seleccionados.delete(id);
        }
      });
    });
  }

  function cargarPerfumes() {
    const params = new URLSearchParams({
      genero: document.getElementById("f-genero").value,
      familia_olfativa: document.getElementById("f-familia").value,
      marca: document.getElementById("f-marca").value,
      nombre: document.getElementById("f-nombre").value,
    });

    fetch(
      `{% url 'contabilidad:lista_precios_perfumes_json' %}?${params.toString()}`,
    )
      .then((res) => res.json())
      .then((data) => {
        if (tabla) {
          tabla.destroy();
        }
        renderFilas(data.perfumes);
        tabla = $("#tabla-perfumes").DataTable({
          language: {
            url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json",
          },
          pageLength: 25,
          responsive: true,
          columnDefs: [{ orderable: false, targets: [0] }],
        });
      });
  }

  $(document).ready(function () {
    cargarPerfumes();

    let timeout;
    ["f-genero", "f-familia", "f-marca", "f-nombre"].forEach((id) => {
      document.getElementById(id).addEventListener("input", function () {
        clearTimeout(timeout);
        timeout = setTimeout(cargarPerfumes, 300);
      });
      document.getElementById(id).addEventListener("change", cargarPerfumes);
    });

    document
      .getElementById("check-all")
      .addEventListener("change", function () {
        const checkThis = this.checked;
        document.querySelectorAll(".perfume-check").forEach((cb) => {
          cb.checked = checkThis;
          const id = Number.parseInt(cb.value);
          if (checkThis) seleccionados.add(id);
          else seleccionados.delete(id);
        });
      });
  });
</script>
{% endblock %}
